<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>icqr-mock</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <canvas id="qr-tree"></canvas>
    <h1>icqr-mock</h1>
    <div class="input-container">
        <input type="text" id="qr-input" placeholder="Enter text to encode">
        <input type="button" id="qr-input-button" value="Generate QR Code">
    </div>
    <div id="qr-code" hidden></div>
    <div class="input-container">
        <input type="button" id="persp-cam-button" value="Perspective camera">
        <input type="button" id="ortho-cam-button" value="Orthographic camera">
    </div>
    <div class="input-container">
        <input type="button" id="reset-button" value="Show QR Code">
    </div>


</body>

<!-- if we dont want to npx install we can use this -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="main.mjs"></script>

</html>
